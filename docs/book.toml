[book]
title = "IronBlockTransfer (ibt) Documentation"
authors = ["nervosys"]
description = "Comprehensive documentation for the ibt disk imaging tool"
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/nervosys/IronBlockTransfer"
edit-url-template = "https://github.com/nervosys/IronBlockTransfer/edit/main/docs/{path}"
site-url = "/IronBlockTransfer/"
